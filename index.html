<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT GROUP - بوابة السائقين</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-amber: #f59e0b;
            --accent-green: #10b981; --accent-red: #ef4444; --accent-indigo: #6366f1;
            --text-main: #f8fafc; --text-sub: #94a3b8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; direction: rtl; }
        header { background-color: rgba(30, 41, 59, 0.95); border-bottom: 1px solid rgba(245, 158, 11, 0.3); padding: 12px 16px; position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; }
        .logo-group { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background-color: var(--accent-amber); color: #000; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; }
        .header-title h1 { font-size: 14px; color: var(--accent-amber); font-weight: 800; }
        .header-title p { font-size: 9px; color: var(--text-sub); }
        main { max-width: 480px; margin: 0 auto; padding: 12px 16px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 800; color: var(--accent-amber); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background-color: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; outline: none; }
        .btn-submit { width: 100%; background-color: var(--accent-amber); color: #000; border: none; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 4px; }
        .btn-danger { background-color: var(--accent-red); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #000; }
        .driver-info-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .chat-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; height: 120px; overflow-y: auto; margin-bottom: 8px; font-size: 10px; }
        .chat-msg { margin-bottom: 6px; padding: 4px 8px; border-radius: 6px; background: rgba(51, 65, 85, 0.4); }
        .chat-msg.admin { background: rgba(99, 102, 241, 0.2); border-right: 2px solid var(--accent-indigo); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="logo-icon">🚖</div>
            <div class="header-title">
                <h1>MT GROUP DRIVER</h1>
                <p>بوابة السائقين والورديات</p>
            </div>
        </div>
        <button id="logoutBtn" onclick="logoutDriver()" class="hidden" style="background:transparent; border:1px solid var(--accent-red); color:var(--accent-red); border-radius:8px; padding:4px 8px; font-size:10px; cursor:pointer;">خروج</button>
    </header>

    <main>
        <!-- شاشة تسجيل الدخول -->
        <div id="loginSection" class="card">
            <div class="card-header"><span class="card-title">🔑 تسجيل دخول السائق</span></div>
            <div class="form-group">
                <label>اختر اسمك من الأسطول</label>
                <select id="loginDriverSelect" class="form-control"></select>
            </div>
            <button onclick="loginDriver()" class="btn-submit">دخول</button>
        </div>

        <!-- الشاشة الرئيسية للسائق -->
        <div id="driverDashboard" class="hidden">
            <div class="driver-info-box">
                <div>
                    <span id="welcomeDriverName" style="font-weight:800; color:var(--accent-amber); font-size:13px;"></span>
                    <p id="driverCarInfo" style="color:var(--text-sub); margin-top:2px;"></p>
                </div>
                <span id="shiftStatusBadge" style="font-size:9px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(148,163,184,0.1); color:var(--text-sub);">في الاستراحة</span>
            </div>

            <!-- لوحة التحكم بالوردية -->
            <div class="card">
                <div class="card-header"><span class="card-title">⏱️ إدارة وردية العمل والعداد</span></div>
                
                <div id="startShiftControls">
                    <div class="form-group">
                        <label>📸 تصوير عداد البداية (الكاميرا مباشرة):</label>
                        <!-- تم إضافة capture="environment" لفتح كاميرا الهاتف الخلفية مباشرة -->
                        <input type="file" id="startOdoFile" accept="image/*" capture="environment" class="form-control">
                    </div>
                    <button onclick="startShift()" class="btn-submit btn-green">📷 فتح الكاميرا وبدء الوردية</button>
                </div>

                <div id="endShiftControls" class="hidden">
                    <p style="font-size:11px; color:var(--accent-green); margin-bottom:8px; font-weight:bold;" id="activeShiftTimerText">الوردية قيد العمل...</p>
                    <div class="form-group">
                        <label>📸 تصوير عداد النهاية (الكاميرا مباشرة):</label>
                        <!-- تم إضافة capture="environment" لفتح كاميرا الهاتف الخلفية مباشرة -->
                        <input type="file" id="endOdoFile" accept="image/*" capture="environment" class="form-control">
                    </div>
                    <button onclick="endShift()" class="btn-submit btn-danger">📷 فتح الكاميرا وإنهاء الوردية</button>
                </div>
            </div>

            <!-- طلب سلفة مالية -->
            <div class="card">
                <div class="card-header"><span class="card-title">💵 طلب سلفة مالية</span></div>
                <div class="form-group">
                    <label>المبلغ المطلوب (ل.س)</label>
                    <input type="number" id="advanceAmountInput" placeholder="مثال: 50000" class="form-control">
                </div>
                <button onclick="requestAdvance()" class="btn-submit">إرسال طلب السلفة للإدارة</button>
            </div>

            <!-- الدردشة وملاحظات الإدارة -->
            <div class="card">
                <div class="card-header"><span class="card-title">💬 الدردشة والملاحظات مع الإدارة</span></div>
                <div id="driverChatBox" class="chat-box"></div>
                <div class="form-group" style="margin-bottom:0; display:flex; gap:6px; margin-top:6px;">
                    <input type="text" id="driverChatInput" placeholder="اكتب رسالتك للإدارة..." class="form-control" style="margin-bottom:0;">
                    <button onclick="sendDriverNote()" class="btn-submit" style="width:auto; margin:0; padding:10px 14px;">إرسال</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXmCRvDy30zwtI904kG_4VL9cPeSpUYJA",
            authDomain: "mt-taxi-b608f.firebaseapp.com",
            projectId: "mt-taxi-b608f",
            storageBucket: "mt-taxi-b608f.firebasestorage.app",
            messagingSenderId: "757032602654",
            appId: "1:757032602654:web:715ba83f30367de5e0720f",
            databaseURL: "https://mt-taxi-b608f-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentDriver = JSON.parse(localStorage.getItem('mt_current_driver')) || null;
        let allCarsData = [];
        let activeShiftsData = {};

        db.ref('cars').on('value', (snapshot) => {
            allCarsData = snapshot.val() ? Object.values(snapshot.val()) : [];
            updateDriverSelectOptions();
            if (currentDriver) verifyDriverSession();
        });

        db.ref('activeShifts').on('value', (snapshot) => {
            activeShiftsData = snapshot.val() || {};
            if (currentDriver) updateShiftUIState();
        });

        function updateDriverSelectOptions() {
            const select = document.getElementById('loginDriverSelect');
            if (!select) return;
            let driversList = [];
            allCarsData.forEach(c => {
                if (c.dayDriver?.name?.trim()) driversList.push({ name: c.dayDriver.name, car: c.plate, shift: 'نهاري', carId: c.id });
                if (c.nightDriver?.name?.trim()) driversList.push({ name: c.nightDriver.name, car: c.plate, shift: 'ليلي', carId: c.id });
            });
            select.innerHTML = `<option value="">اختر اسمك...</option>` + driversList.map(d => `<option value="${d.name}|${d.car}|${d.shift}|${d.carId}">${d.name} (${d.car} - ${d.shift})</option>`).join('');
        }

        function loginDriver() {
            const val = document.getElementById('loginDriverSelect').value;
            if (!val) { alert("الرجاء اختيار اسمك."); return; }
            const parts = val.split('|');
            currentDriver = { name: parts[0], car: parts[1], shift: parts[2], carId: Number(parts[3]) };
            localStorage.setItem('mt_current_driver', JSON.stringify(currentDriver));
            verifyDriverSession();
        }

        function verifyDriverSession() {
            if (!currentDriver) return;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('driverDashboard').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('welcomeDriverName').innerText = currentDriver.name;
            document.getElementById('driverCarInfo').innerText = `السيارة: ${currentDriver.car} (${currentDriver.shift})`;
            
            updateShiftUIState();
            loadDriverChat();
        }

        function logoutDriver() {
            localStorage.removeItem('mt_current_driver');
            currentDriver = null;
            document.getElementById('driverDashboard').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function getSaturdayWeekId(dateObj = new Date()) {
            const d = new Date(dateObj);
            const day = d.getDay();
            let diff = (day >= 6) ? (day - 6) : (day + 1);
            d.setDate(d.getDate() - diff);
            return `${d.getFullYear()}-W_Sat_${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function startShift() {
            const fileInput = document.getElementById('startOdoFile');
            let imgBase64 = "";
            if (fileInput.files && fileInput.files[0]) {
                imgBase64 = await fileToBase64(fileInput.files[0]);
            } else {
                alert("⚠️ يرجى تصوير العداد من الكاميرا أولاً.");
                return;
            }

            const timestamp = Date.now();
            const weekId = getSaturdayWeekId();
            const dateKey = new Date().toISOString().split('T')[0];

            const shiftData = { driver: currentDriver.name, car: currentDriver.car, timestamp: timestamp };
            
            const updates = {};
            updates[`activeShifts/${currentDriver.carId}`] = shiftData;
            updates[`weeklyRecords/${weekId}/${currentDriver.name}/odoStartImg`] = imgBase64;
            updates[`weeklyRecords/${weekId}/${currentDriver.name}/odoStartTimestamp`] = timestamp;
            updates[`weeklyRecords/${weekId}/${currentDriver.name}/days/${dateKey}/startTime`] = timestamp;
            updates[`weeklyRecords/${weekId}/${currentDriver.name}/days/${dateKey}/status`] = 'present';

            db.ref().update(updates).then(() => {
                alert("✅ تم التقاط الصورة وبدء الوردية بنجاح!");
                fileInput.value = "";
            });
        }

        async function endShift() {
            const fileInput = document.getElementById('endOdoFile');
            let imgBase64 = "";
            if (fileInput.files && fileInput.files[0]) {
                imgBase64 = await fileToBase64(fileInput.files[0]);
            } else {
                alert("⚠️ يرجى تصوير العداد من الكاميرا أولاً.");
                return;
            }

            const shiftData = activeShiftsData[currentDriver.carId];
            if (!shiftData) return;

            const endTime = Date.now();
            const elapsedHours = Math.max(0, (endTime - shiftData.timestamp) / 1000) / 3600;
            const weekId = getSaturdayWeekId();
            const dateKey = new Date().toISOString().split('T')[0];

            db.ref(`weeklyRecords/${weekId}/${currentDriver.name}/hours`).once('value', (snapshot) => {
                const currentHours = Number(snapshot.val()) || 0;
                const newTotalHours = currentHours + elapsedHours;

                const updates = {};
                updates[`activeShifts/${currentDriver.carId}`] = null;
                updates[`weeklyRecords/${weekId}/${currentDriver.name}/hours`] = newTotalHours;
                updates[`weeklyRecords/${weekId}/${currentDriver.name}/odoEndImg`] = imgBase64;
                updates[`weeklyRecords/${weekId}/${currentDriver.name}/odoEndTimestamp`] = endTime;
                updates[`weeklyRecords/${weekId}/${currentDriver.name}/days/${dateKey}/endTime`] = endTime;

                db.ref().update(updates).then(() => {
                    alert("✅ تم إنهاء الوردية بنجاح وحساب الساعات!");
                    fileInput.value = "";
                });
            });
        }

        function updateShiftUIState() {
            if (!currentDriver) return;
            const shift = activeShiftsData[currentDriver.carId];
            const isMyShiftActive = shift && (shift.driver === currentDriver.name);

            const startControls = document.getElementById('startShiftControls');
            const endControls = document.getElementById('endShiftControls');
            const badge = document.getElementById('shiftStatusBadge');

            if (isMyShiftActive) {
                startControls.classList.add('hidden');
                endControls.classList.remove('hidden');
                badge.innerText = "🟢 في وردية نشطة";
                badge.style.background = "rgba(16, 185, 129, 0.2)";
                badge.style.color = "var(--accent-green)";
            } else {
                startControls.classList.remove('hidden');
                endControls.classList.add('hidden');
                badge.innerText = "⚪ في الاستراحة";
                badge.style.background = "rgba(148, 163, 184, 0.1)";
                badge.style.color = "var(--text-sub)";
            }
        }

        function requestAdvance() {
            const amount = Number(document.getElementById('advanceAmountInput').value);
            if (!amount || amount <= 0) { alert("أدخل مبلغاً صحيحاً."); return; }

            const weekId = getSaturdayWeekId();
            db.ref(`weeklyRecords/${weekId}/${currentDriver.name}/advances`).once('value', (snapshot) => {
                const currentAdv = Number(snapshot.val()) || 0;
                db.ref(`weeklyRecords/${weekId}/${currentDriver.name}/advances`).set(currentAdv + amount).then(() => {
                    alert("✅ تم إرسال طلب السلفة بنجاح للإدارة.");
                    document.getElementById('advanceAmountInput').value = "";
                });
            });
        }

        function loadDriverChat() {
            if (!currentDriver) return;
            db.ref(`notes/${currentDriver.name}`).on('value', (snapshot) => {
                const chatBox = document.getElementById('driverChatBox');
                const data = snapshot.val() || {};
                const msgs = Object.values(data);
                if (msgs.length === 0) {
                    chatBox.innerHTML = `<p style="color:var(--text-sub); text-align:center; padding-top:40px;">لا توجد رسائل سابقة.</p>`;
                    return;
                }
                chatBox.innerHTML = msgs.map(m => `
                    <div class="chat-msg ${m.sender === 'الإدارة' ? 'admin' : ''}">
                        <b>${m.sender}:</b> ${m.text}
                    </div>
                `).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function sendDriverNote() {
            const input = document.getElementById('driverChatInput');
            const text = input.value.trim();
            if (!text || !currentDriver) return;

            db.ref(`notes/${currentDriver.name}`).push({
                sender: currentDriver.name,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                input.value = "";
            });
        }
    </script>
</body>
</html>
