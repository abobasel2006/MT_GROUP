name: Validate MT TAXI 2.0

on:
  push:
    branches: [mt-taxi-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backend JavaScript syntax
        if: hashFiles('functions/**/*.js') != ''
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find functions -type f -name '*.js' -print)
      - name: Validate browser ES module syntax
        run: |
          find . -path './node_modules' -prune -o -path './.git' -prune -o -type f -name '*.js' ! -path './functions/*' -print0 |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
      - name: Validate JSON configuration
        run: |
          find . -path './node_modules' -prune -o -path './.git' -prune -o -type f \( -name '*.json' \) -print0 |
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done
